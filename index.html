<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Forklift Crossing</title>
<style>
:root{--gold:#f6bb27;--dark:#111b25;--light:#f5f5ed}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#101821;color:white;font:600 15px system-ui,Arial}button{font:inherit;cursor:pointer}#wrap{position:fixed;inset:0;display:flex;flex-direction:column}#hud{height:56px;background:#101821;display:flex;align-items:center;justify-content:space-between;padding:4px 13px;gap:8px;border-bottom:2px solid #d69d20;z-index:3}#hud .brand{font-size:clamp(12px,2.7vw,18px);color:var(--gold);font-weight:900}#hud .stats{font-size:clamp(11px,2.6vw,15px);text-align:center}#hud button{background:#29394a;color:white;border:1px solid #637488;border-radius:8px;padding:7px 11px}#game{display:block;width:100%;height:calc(100% - 56px);touch-action:none}#overlay{position:absolute;inset:56px 0 0;background:#07111cbb;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}#overlay.hidden{display:none}.panel{width:min(440px,96vw);max-height:90%;overflow:auto;background:#172331;border:2px solid var(--gold);border-radius:18px;text-align:center;padding:24px 20px;box-shadow:0 15px 50px #000a}.panel h1{color:var(--gold);font-size:clamp(27px,7vw,40px);margin:5px 0}.panel h2{color:var(--gold);margin:6px}.panel p{font-weight:400;line-height:1.5;color:#d3dde7}.panel button{background:var(--gold);border:0;color:#17202b;padding:13px 17px;margin:6px;border-radius:10px;font-weight:900}.panel .secondary{background:#34485b;color:white}.panel select{padding:9px;border-radius:8px;background:#26384a;color:white;border:1px solid #a3aeba;max-width:100%}.tiny{font-size:12px!important;color:#9db0c1!important}#stickZone{position:absolute;bottom:18px;left:17px;width:136px;height:136px;border-radius:50%;background:#1c2937a8;border:2px solid #f6bb2766;display:none;z-index:4;touch-action:none}#knob{position:absolute;left:43px;top:43px;width:48px;height:48px;border-radius:50%;background:var(--gold);box-shadow:0 2px 15px #0008}#hint{position:absolute;bottom:12px;right:12px;color:#ffeb9e;background:#101821bc;padding:7px 10px;border-radius:7px;font-size:12px;pointer-events:none}body.touch #stickZone{display:block}body.touch #hint{display:none}@media(max-height:470px){#stickZone{width:105px;height:105px}#knob{left:32px;top:32px;width:37px;height:37px}}
</style></head><body><div id="wrap"><div id="hud"><span class="brand">⚠ FORKLIFT CROSSING</span><span class="stats" id="stats">POZIOM 1 · ♥♥♥ · 0 PKT</span><button id="pause">Ⅱ</button></div><canvas id="game"></canvas><div id="stickZone"><div id="knob"></div></div><div id="hint">WASD / strzałki — jazda · P — pauza</div><div id="overlay"><div class="panel" id="panel"></div></div></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),g=cv.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),stick=document.getElementById('stickZone'),knob=document.getElementById('knob');
const saveKey='forklift-crossing-v1';let save={unlocked:1,best:0};try{save={...save,...JSON.parse(localStorage.getItem(saveKey)||'{}')}}catch{}
let w=600,h=700,dpr=1,unit=70,level=1,lives=3,score=0,phase='pickup',loadProgress=0,loadDuration=1.6,mode='menu',elapsed=0,clock=0,last=0,inv=0,camera=0,vehicles=[],decor=[],player={x:0,y:0,a:-Math.PI/2},joy={x:0,y:0},keys={},audio=null,musicOn=true,sfxOn=true,musicStep=0,musicClock=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const types=[{name:'TRUCK',len:1.8,speed:1.35,color:'#cf5b37'},{name:'LOWLOADER',len:2.8,speed:.85,color:'#caad57'},{name:'LOADER',len:1.65,speed:.7,color:'#e6ad23'},{name:'GARBAGE',len:2.05,speed:1.08,color:'#4a9c69'}];
const roadStart=3, garageY=0, goalY=()=>-(level+5)*unit, roadY=i=>-(roadStart+i)*unit;
function store(){try{localStorage.setItem(saveKey,JSON.stringify(save))}catch{}}
function resize(){const r=cv.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);unit=clamp(Math.min(w*.16,h*.115),43,74);if(mode==='play'||mode==='paused'){makeLevel(false)}}window.addEventListener('resize',resize);
function menu(title,desc,buttons){mode='menu';overlay.classList.remove('hidden');panel.innerHTML='<h1>'+title+'</h1><p>'+desc+'</p>'+buttons.map((b,i)=>'<button data-b="'+i+'" class="'+(b.secondary?'secondary':'')+'">'+b.text+'</button>').join('')+'<p class="tiny">Postęp jest zapisywany w tej przeglądarce.</p>';panel.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>buttons[+el.dataset.b].fn())}
function home(){menu('FORKLIFT<br>CROSSING','🚜 Przejedź przez drogę, odbierz paletę z przyczepy i wróć przed garaż. Unikaj ciężarówek, lawet, maszyn budowlanych i śmieciarek.',[{text:'▶ GRAJ',fn:()=>start(save.unlocked)},{text:'WYBIERZ POZIOM',fn:choose,secondary:true},{text:'DŹWIĘK: '+(musicOn?'WŁ.':'WYŁ.'),fn:()=>{musicOn=!musicOn;sfxOn=musicOn;home()},secondary:true}])}
function choose(){let options=Array.from({length:Math.min(save.unlocked,150)},(_,i)=>'<option value="'+(i+1)+'">Poziom '+(i+1)+'</option>').join('');menu('WYBÓR POZIOMU','Odblokowano poziomów: '+save.unlocked+'<br>Rekord: '+save.best+' pkt',[{text:'▶ ROZPOCZNIJ',fn:()=>start(+(panel.querySelector('select')?.value||1))},{text:'POWRÓT',fn:home,secondary:true}]);panel.querySelector('p').insertAdjacentHTML('afterend','<select id="levelPick">'+options+'</select><br>');panel.querySelector('#levelPick').value=save.unlocked}
function start(n){level=n;lives=3;score=0;makeLevel(true);mode='play';overlay.classList.add('hidden');initAudio();last=performance.now()}
function makeLevel(reset){if(reset){elapsed=0;phase='pickup';loadProgress=0;inv=0}player={x:0,y:unit*.65,a:-Math.PI/2};camera=player.y;vehicles=[];decor=[];
for(let i=0;i<level;i++){const dir=i%2===0?1:-1,boost=1+Math.min(level*.018,.32);let cursor=-w*.9-unit*7;let j=0;while(cursor<w*.9+unit*7){const type=(i+j+Math.floor(j/3))%types.length,t=types[type],length=t.len*unit;cursor+=length/2;vehicles.push({lane:i,dir,type,x:cursor,y:roadY(i),length,width:unit*.57,speed:t.speed*unit*boost,seed:j});cursor+=length/2+unit*rand(1.8,3.1);j++}}
for(let i=0;i<180;i++){let y=rand(goalY()-unit*3,unit*4),x=rand(-Math.max(w,600),Math.max(w,600));decor.push({x,y,kind:i%7,angle:rand(-1,1)})}updateHud()}
function updateHud(){stats.textContent='POZIOM '+level+' · '+'♥'.repeat(lives)+'♡'.repeat(3-lives)+' · '+score+' PKT · '+(phase==='pickup'?'ODBIERZ PALETĘ':phase==='loading'?'ZAŁADUNEK...':'WRÓĆ DO GARAŻU')}
function beep(f=180,d=.12,kind='sawtooth',vol=.05){if(!audio||!sfxOn)return;let o=audio.createOscillator(),v=audio.createGain();o.type=kind;o.frequency.setValueAtTime(f,audio.currentTime);v.gain.setValueAtTime(vol,audio.currentTime);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function music(dt){if(!audio||!musicOn||mode!=='play')return;musicClock+=dt;let beat=.255;while(musicClock>beat){musicClock-=beat;const notes=[110,0,110,146.83,164.81,0,146.83,110,98,0,98,130.81,146.83,0,130.81,98];let f=notes[musicStep%16];if(f)beep(f,.17,'sawtooth',.018);if(musicStep%4===0)beep(55,.09,'triangle',.045);musicStep++}}
function collision(){if(inv>0)return;lives--;beep(70,.4,'sawtooth',.12);updateHud();if(lives<=0){save.best=Math.max(save.best,score);store();menu('GAME OVER','Wynik: '+score+' pkt<br>Osiągnięty poziom: '+level,[{text:'SPRÓBUJ PONOWNIE',fn:()=>start(level)},{text:'WYBÓR POZIOMU',fn:choose,secondary:true},{text:'MENU',fn:home,secondary:true}])}else{player.x=0;player.y=unit*.65;player.a=-Math.PI/2;phase='pickup';loadProgress=0;inv=2;updateHud()}}
function complete(){let bonus=Math.max(0,Math.floor(700-elapsed*8));score+=1000+bonus+lives*250;save.unlocked=Math.max(save.unlocked,level+1);save.best=Math.max(save.best,score);store();beep(520,.22,'triangle',.07);let finished=level;mode='menu';menu('DOSTAWA UDANA!','Poziom '+finished+' ukończony!<br>Bonus za czas: '+bonus+'<br>Życia: '+lives+'<br><strong>Wynik: '+score+' pkt</strong>',[{text:'NASTĘPNY POZIOM ▶',fn:()=>{level=finished+1;lives=3;makeLevel(true);mode='play';overlay.classList.add('hidden');last=performance.now()}},{text:'MENU',fn:home,secondary:true}])}
function update(dt){if(mode!=='play')return;elapsed+=dt;inv=Math.max(0,inv-dt);music(dt);let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;let mag=Math.hypot(dx,dy);if(phase==='loading'){dx=0;dy=0;mag=0;loadProgress=Math.min(loadDuration,loadProgress+dt);if(loadProgress>=loadDuration){phase='return';beep(440,.18,'triangle');updateHud()}}if(mag>.12){dx/=Math.max(1,mag);dy/=Math.max(1,mag);let speed=unit*(phase==='return'?2.45:2.85);player.x=clamp(player.x+dx*speed*dt,-w*.46,w*.46);player.y=clamp(player.y+dy*speed*dt,goalY()-unit*1.6,unit*1.65);let target=Math.atan2(dy,dx)+Math.PI/2,delta=Math.atan2(Math.sin(target-player.a),Math.cos(target-player.a));player.a+=clamp(delta,-dt*10,dt*10)}
camera+=(player.y-camera)*Math.min(1,dt*5);
for(let lane=0;lane<level;lane++){const group=vehicles.filter(v=>v.lane===lane).sort((a,b)=>(b.x-a.x)*(lane%2===0?1:-1));for(let k=1;k<group.length;k++){const lead=group[k-1],trail=group[k],gap=(lead.length+trail.length)/2+unit*.42;if((lead.x-trail.x)*lead.dir<gap)trail.x=lead.x-lead.dir*gap}}

for(let v of vehicles){v.x+=v.dir*v.speed*dt;let lim=w*.7+unit*4;if(v.dir>0&&v.x-v.length/2>lim){let behind=vehicles.filter(q=>q.lane===v.lane&&q!==v).reduce((m,q)=>Math.min(m,q.x-q.length/2),-lim);v.x=Math.min(-lim-v.length/2,behind-v.length/2-unit*2)}if(v.dir<0&&v.x+v.length/2< -lim){let ahead=vehicles.filter(q=>q.lane===v.lane&&q!==v).reduce((m,q)=>Math.max(m,q.x+q.length/2),lim);v.x=Math.max(lim+v.length/2,ahead+v.length/2+unit*2)}if(Math.abs(player.y-v.y)<unit*.40&&Math.abs(player.x-v.x)<(v.length+unit*.48)/2){collision();break}}
if(mode!=='play')return;
if(phase==='pickup'&&Math.hypot(player.x,player.y-goalY())<unit*.52&&Math.abs(Math.atan2(Math.sin(player.a+Math.PI/2),Math.cos(player.a+Math.PI/2)))<1.2){phase='loading';loadProgress=0;beep(270,.12,'triangle');updateHud()}
if(phase==='return'&&Math.abs(player.x)<unit*1.12&&player.y>unit*.05){complete()}
}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function round(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function tire(x,y,l,t){round(x-l/2,y-t/2,l,t,Math.min(3,t*.2),'#101419');rect(x-l*.34,y-t*.31,l*.68,t*.10,'#30353a');rect(x-l*.34,y+t*.21,l*.68,t*.10,'#30353a')}
function line(x1,y1,x2,y2,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function topCab(x,y,l,b,body){round(x,y,l,b,4,body);round(x+l*.22,y+b*.13,l*.36,b*.74,3,'#9fcbd2');rect(x+l*.59,y+b*.11,l*.07,b*.78,'#35474e');rect(x+l*.08,y+b*.14,l*.09,b*.72,'#425158');line(x+l*.22,y+b*.12,x+l*.22,y+b*.88,'#e4e7d7',1.5)}
function drawVehicle(v){g.save();g.translate(v.x,v.y);if(v.dir<0)g.rotate(Math.PI);const u=unit,L=v.length,B=v.width,rear=-L/2,front=L/2;
// All vehicle wheels are horizontal dark tire strips protruding slightly from the upper/lower outline.
for(let xx of [rear+u*.26,front-u*.29])for(let side of [-1,1])tire(xx,side*(B*.49),u*.26,u*.15);
round(rear,-B*.38,L,B*.76,4,'#222b31');
if(v.type===0){ // Dump truck, cargo bed behind a short roofed cab.
round(rear+u*.05,-B*.39,L-u*.59,B*.78,4,'#9b4b30');round(rear+u*.11,-B*.32,L-u*.71,B*.64,3,'#c97749');rect(rear+u*.16,-B*.28,L-u*.82,B*.08,'#e5a06c');rect(rear+u*.16,B*.20,L-u*.82,B*.08,'#86472f');for(let j=1;j<4;j++)line(rear+u*.16+(L-u*.82)*j/4,-B*.25,rear+u*.16+(L-u*.82)*j/4,B*.25,'#a85b39',2);topCab(front-u*.55,-B*.40,u*.52,B*.80,'#e4ac35');
}else if(v.type===1){ // Low-loader: flat deck and tracked excavator viewed vertically.
round(rear+u*.05,-B*.37,L-u*.58,B*.74,3,'#9aabb2');rect(rear+u*.11,-B*.30,L-u*.70,B*.60,'#65757d');for(let j=0;j<5;j++)line(rear+u*(.2+j*.21),-B*.28,rear+u*(.2+j*.21),B*.28,'#8b999c',1.5);
let ex=rear+L*.39;round(ex-u*.36,-B*.27,u*.72,u*.16,4,'#2b3439');round(ex-u*.36,B*.11,u*.72,u*.16,4,'#2b3439');round(ex-u*.24,-B*.18,u*.48,B*.36,5,'#e5b12c');round(ex-u*.12,-B*.13,u*.23,B*.26,3,'#6f8e98');line(ex+u*.17,0,ex+u*.37,-u*.13,'#f1c440',u*.085);line(ex+u*.37,-u*.13,ex+u*.43,u*.12,'#f1c440',u*.07);round(ex+u*.37,u*.07,u*.18,u*.12,2,'#394249');topCab(front-u*.53,-B*.40,u*.50,B*.80,'#bd483d');
}else if(v.type===2){ // Loader: thick tires, centered cab, two parallel lift arms and bucket.
for(let xx of [rear+u*.24,front-u*.38])for(let side of [-1,1])tire(xx,side*B*.50,u*.32,u*.21);
round(rear+u*.06,-B*.34,L-u*.24,B*.68,6,'#e8b328');round(rear+u*.34,-B*.35,u*.49,B*.70,5,'#25333a');round(rear+u*.42,-B*.27,u*.31,B*.54,3,'#83bac6');rect(rear+u*.14,-B*.22,u*.15,B*.44,'#d39a20');for(let side of [-1,1]){line(front-u*.53,side*B*.22,front-u*.15,side*B*.31,'#ffd046',u*.09)}round(front-u*.16,-B*.52,u*.25,B*1.04,3,'#434b4e');rect(front+u*.03,-B*.45,u*.035,B*.9,'#222a2d');
}else{ // Refuse truck: enclosed rectangular compactor and loading mechanism.
round(rear+u*.05,-B*.40,L-u*.57,B*.80,5,'#256d4e');round(rear+u*.17,-B*.32,L-u*.78,B*.64,3,'#42976b');rect(rear+u*.19,-B*.27,L-u*.85,B*.08,'#77b48b');rect(rear+u*.19,B*.19,L-u*.85,B*.08,'#1f6346');for(let j=1;j<4;j++)line(rear+u*.2+(L-u*.85)*j/4,-B*.25,rear+u*.2+(L-u*.85)*j/4,B*.25,'#2d7653',2);rect(rear+u*.03,-B*.42,u*.19,B*.84,'#88999b');topCab(front-u*.55,-B*.40,u*.52,B*.80,'#e0e6da');}
// Headlamps and rear markers, as seen from above.
rect(front-u*.045,-B*.31,u*.035,B*.14,'#f6e4a2');rect(front-u*.045,B*.17,u*.035,B*.14,'#f6e4a2');rect(rear,-B*.29,u*.035,B*.12,'#e44b3e');rect(rear,B*.17,u*.035,B*.12,'#e44b3e');g.restore()}
function drawForklift(){g.save();g.translate(player.x,player.y);g.rotate(player.a);if(inv>0&&Math.floor(inv*10)%2===0)g.globalAlpha=.4;const u=unit;
// Forklift front points up; tire treads are tucked beneath the chassis, not floating beside it.
for(let xx of [-u*.245,u*.245]){tire(xx,-u*.16,u*.13,u*.27);tire(xx,u*.22,u*.13,u*.22)}
round(-u*.24,-u*.24,u*.48,u*.60,7,'#1b252c');round(-u*.22,u*.16,u*.44,u*.17,5,'#e6aa16');round(-u*.21,-u*.23,u*.42,u*.42,5,'#f2c22a');round(-u*.155,-u*.17,u*.31,u*.26,4,'#283d46');round(-u*.12,-u*.115,u*.24,u*.15,3,'#7099a2');
rect(-u*.23,-u*.29,u*.07,u*.37,'#20292e');rect(u*.16,-u*.29,u*.07,u*.37,'#20292e');rect(-u*.27,-u*.34,u*.54,u*.07,'#30393f');
rect(-u*.19,-u*.70,u*.065,u*.36,'#c1c9cc');rect(u*.125,-u*.70,u*.065,u*.36,'#c1c9cc');
if(phase==='return'){round(-u*.33,-u*.73,u*.66,u*.31,3,'#a06a33');for(let i=0;i<4;i++)rect(-u*.28+i*u*.155,-u*.69,u*.09,u*.23,'#dbab6c');rect(-u*.33,-u*.55,u*.66,u*.04,'#67492e')}g.restore()}
function draw(){g.setTransform(dpr,0,0,dpr,0,0);rect(0,0,w,h,'#52694c');g.save();g.translate(w/2,h*.57-camera);let left=-w*.75,right=w*.75;rect(left,goalY()-unit*2,right-left,unit*3.2,'#64734a');rect(left,unit*1.55,right-left,unit*4,'#6b6b58');rect(left,unit*.95,right-left,unit*.8,'#88877b');rect(left,unit*1.7,right-left,unit*1.1,'#52534e');
for(let i=0;i<level;i++){let y=roadY(i);rect(left,y-unit*.5,right-left,unit,'#3d454b');rect(left,y-unit*.51,right-left,3,'#8c8c7b');g.strokeStyle='#e0d6a7';g.lineWidth=2;g.setLineDash([unit*.3,unit*.28]);g.beginPath();g.moveTo(left,y+unit*.49);g.lineTo(right,y+unit*.49);g.stroke();g.setLineDash([])}
for(let d of decor){let isRoad=d.y<roadY(0)+unit*.5&&d.y>roadY(level-1)-unit*.5;if(isRoad)continue;g.save();g.translate(d.x,d.y);g.rotate(d.angle);if(d.kind===0){rect(-11,-6,22,12,'#806a4a');rect(-7,-10,14,20,'#a1835a')}else if(d.kind===1){g.strokeStyle='#433c32';g.lineWidth=3;g.beginPath();g.ellipse(0,0,18,5,0,0,Math.PI*2);g.stroke()}else if(d.kind===2){rect(-9,-6,18,12,'#7a8486')}else if(d.kind===3){rect(-6,-4,12,8,'#3c5639')}else if(d.kind===4){rect(-8,-3,16,6,'#8b7758')}else{g.fillStyle='#3f5e3e';g.beginPath();g.arc(0,0,3,0,7);g.fill()}g.restore()}
round(-unit*1.6,unit*1.6,unit*3.2,unit*1.4,5,'#343b42');rect(-unit*1.4,unit*1.72,unit*2.8,unit*.92,'#92928b');for(let i=0;i<6;i++)rect(-unit*1.3+i*unit*.45,unit*1.75,unit*.07,unit*.85,'#55595c');round(-unit*1.05,unit*.1,unit*2.1,unit*.7,6,'#e2bd48');g.fillStyle='#17202b';g.font='bold '+Math.round(unit*.22)+'px system-ui';g.textAlign='center';g.fillText('DROP ZONE',0,unit*.52);
let gy=goalY();round(-unit*1.1,gy-unit*.55,unit*2.2,unit*1.1,9,'#5a4a37');round(-unit*.85,gy-unit*.43,unit*1.7,unit*.86,6,'#a38b5a');for(let i=0;i<4;i++)rect(-unit*.75+i*unit*.39,gy-unit*.38,unit*.12,unit*.76,'#756042');if(phase==='pickup'){round(-unit*.33,gy-unit*.27,unit*.66,unit*.54,3,'#b17c3e');for(let i=0;i<3;i++)rect(-unit*.26+i*unit*.22,gy-unit*.23,unit*.12,unit*.46,'#d5a15b')}g.fillStyle='#fff6d1';g.font='bold '+Math.round(unit*.22)+'px system-ui';g.fillText('PALETA',0,gy-unit*.73);
for(let v of vehicles)drawVehicle(v);drawForklift();
if(phase==='loading'){
 const bw=unit*1.65,bh=unit*.19,bx=player.x-bw/2,by=player.y-unit*1.24;
 round(bx-3,by-3,bw+6,bh+6,5,'#111b25');
 round(bx,by,bw,bh,3,'#40505b');
 const fraction=Math.min(1,loadProgress/loadDuration);
 if(fraction>0)round(bx,by,Math.max(2,bw*fraction),bh,3,'#f6bb27');
 g.textAlign='center';g.font='bold '+Math.max(11,Math.round(unit*.19))+'px system-ui';g.fillStyle='#fff7da';
 g.fillText('ZAŁADUNEK '+Math.floor(fraction*100)+'%',player.x,by-8);
}
g.restore();
if(mode==='play'){let target=phase==='pickup'?'ODBIERZ PALETĘ ↑':phase==='loading'?'TRWA ZAŁADUNEK...':'DOSTARCZ DO GARAŻU ↓';round(w/2-105,10,210,28,8,'#10202bdb');g.fillStyle='#ffe18d';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(target,w/2,29)}
}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='p'||e.key==='Escape')togglePause()});window.addEventListener('keyup',e=>{keys[e.key]=false});window.addEventListener('blur',()=>{keys={};joy={x:0,y:0};if(mode==='play')togglePause()});
function togglePause(){if(mode==='play'){mode='paused';overlay.classList.remove('hidden');panel.innerHTML='<h2>PAUZA</h2><p>Poziom '+level+' · '+score+' pkt</p><button id="resume">▶ WZNÓW</button><button class="secondary" id="sound">DŹWIĘK: '+(musicOn?'WŁ.':'WYŁ.')+'</button><button class="secondary" id="back">MENU</button>';panel.querySelector('#resume').onclick=()=>{mode='play';overlay.classList.add('hidden');last=performance.now()};panel.querySelector('#sound').onclick=()=>{musicOn=!musicOn;sfxOn=musicOn;panel.querySelector('#sound').textContent='DŹWIĘK: '+(musicOn?'WŁ.':'WYŁ.')};panel.querySelector('#back').onclick=home}else if(mode==='paused'){mode='play';overlay.classList.add('hidden');last=performance.now()}}
document.getElementById('pause').onclick=togglePause;
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
function setJoy(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),radius=r.width*.34;joy.x=clamp(dx/radius,-1,1);joy.y=clamp(dy/radius,-1,1);if(dist>radius){joy.x=dx/dist;joy.y=dy/dist}knob.style.transform='translate('+(joy.x*radius)+'px,'+(joy.y*radius)+'px)'}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))setJoy(e)});function release(){joy={x:0,y:0};knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
resize();home();requestAnimationFrame(frame);
})();
